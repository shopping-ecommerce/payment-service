<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Test SePay Payment Gateway</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 24px 32px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            width: 90%;
            background: #2563eb;
            color: #fff;
            margin-top: 12px;
        }
        button:hover {
            opacity: 0.9;
        }
        pre {
            text-align: left;
            max-height: 200px;
            overflow: auto;
            background: #111;
            color: #0f0;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Test SePay Payment Gateway (Sandbox)</h2>

    <input id="orderCode" placeholder="Nhập mã đơn hàng (VD: DH1001)" />
    <input id="amount" placeholder="Nhập số tiền (VD: 100000)" type="number" />
    <input id="userId" placeholder="Nhập User ID (VD: USER_123)" />

    <button onclick="payWithSePay()">Thanh toán bằng SePay</button>

    <h3>Log:</h3>
    <pre id="log"></pre>
</div>

<script>
    const API_URL = "http://localhost:8089/payment/sepay/create";

    const TOKEN = "eyJhbGciOiJIUzUxMiJ9...";

    function log(msg, data) {
        const logBox = document.getElementById("log");
        const time = new Date().toLocaleTimeString();

        logBox.textContent += `[${time}] ${msg}\n`;
        if (data) logBox.textContent += JSON.stringify(data, null, 2) + "\n\n";
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function payWithSePay() {
        const orderCode = document.getElementById("orderCode").value.trim();
        const amount = document.getElementById("amount").value.trim();
        const userId = document.getElementById("userId").value.trim();

        if (!orderCode || !amount || !userId) {
            alert("Vui lòng nhập đầy đủ orderCode, amount, userId!");
            return;
        }

        const payload = {
            orderCode,
            amount: Number(amount),
            userId,
        };

        log("Gửi request tạo thanh toán...", payload);

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + TOKEN
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            log("Response backend:", data);

            if (!data || data.code !== 200) {
                alert("Không tạo được phiên thanh toán.");
                return;
            }

            const checkoutUrl = data.result.checkoutUrl;
            const fields = data.result.fields;

            // Tạo form post qua SePay
            const form = document.createElement("form");
            form.method = "POST";
            form.action = checkoutUrl;

            Object.entries(fields).forEach(([key, value]) => {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = key;
                input.value = value;
                form.appendChild(input);
            });

            document.body.appendChild(form);
            log("Chuyển hướng sang trang thanh toán SePay...", fields);

            form.submit();
        } catch (err) {
            log("Lỗi:", err);
            alert("Có lỗi xảy ra khi gọi API.");
        }
    }
</script>
</body>
</html>
